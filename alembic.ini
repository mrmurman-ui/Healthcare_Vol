[alembic]
script_location = migrations
prepend_sys_path = .
# DATABASE_URL_SYNC from .env overrides this — update this line for local runs
# Use your Supabase URL: postgresql+psycopg2://postgres.[REF]:[PASS]@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
sqlalchemy.url = postgresql+psycopg2://postgres.jmmvjatilibasxpmfxbe:xLhS4aymjQomuvEu@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
