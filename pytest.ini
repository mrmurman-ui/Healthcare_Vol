# AI Community Health & Volunteer Operations Platform

Production-ready MVP for Village Health Volunteers (อสม.), Community Health Workers, Community Leaders, Municipal Officers, and NGOs.

## Features
- Volunteer Registry
- Household & Citizen Registry
- Home Visit Tracking
- Referral Management
- GIS / Community Mapping
- Executive Dashboards
- PDF & Excel Reports
- Thai/English Localization
- JWT Auth + RBAC
- Full Audit Trail

## Tech Stack
- Python 3.13 + Streamlit
- PostgreSQL + SQLAlchemy + Alembic
- Docker + Docker Compose
- Pytest (≥80% coverage)

## Quick Start

```bash
cp .env.example .env          # fill in secrets
docker compose up --build -d
# App: http://localhost:8501
```

## Structure
```
app/
  core/           # config, database, security, dependencies
  modules/        # auth, users, volunteers, households, citizens,
                  # home_visits, referrals, dashboard, reports,
                  # gis, audit, localization
  shared/         # base models, schemas, utils
tests/
migrations/
```
