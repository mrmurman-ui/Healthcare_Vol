name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt aiosqlite

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-fail-under=80
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          DATABASE_URL_SYNC: sqlite:///:memory:
          JWT_SECRET_KEY: test-secret
          SECRET_KEY: test-secret

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t health-platform:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite+aiosqlite:///:memory: \
            -e DATABASE_URL_SYNC=sqlite:///:memory: \
            -e JWT_SECRET_KEY=test \
            -e SECRET_KEY=test \
            health-platform:${{ github.sha }} \
            python -c "from app.core.config import settings; print('Config OK:', settings.APP_NAME)"
